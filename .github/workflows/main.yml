name: CI
on:
  push:
    branches:
      - master
      - 'release/**'
  pull_request:
jobs:
  main:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "oldstable"
      - run: go test -covermode=atomic -race -v ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          args: --verbose
      - run: go install ./cmd/diffoci
      - name: smoke test
        run: |
          set -x -o pipefail
          # diffoci exits with 1 when the images differ (expected here), and with 2 on a real error
          diffoci diff --semantic --report-dir=~/tmp/diff alpine:3.18.2 alpine:3.18.3 | tee stdout || [ $? -eq 1 ]
          grep "File    etc/os-release                       fb844374742438cf1b4e675dcd7d87c2fd6fbdb7cc7be30c62d4027240474aaf    e08e943282c5d38f99bfde311c7d5759a4578f92fca5943e5b1351e8cd472892" stdout
          find ~/tmp/diff
